<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Streamlit Quill Custom</title>
    <!-- Include stylesheet -->
    <link href="quill.snow.css" rel="stylesheet">
    <style>
      body { margin: 0; padding: 0; background: white; font-family: sans-serif; overflow: hidden; }
      #editor-container { height: 350px; }
      .ql-editor { font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="editor-container"></div>
    
    <script src="quill.min.js"></script>
    <script>
      try {
        // Initialize Quill editor
        var quill = new Quill('#editor-container', {
          theme: 'snow',
          modules: {
              toolbar: [
                  ['bold', 'italic', 'underline', 'strike'],
                  [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                  [{ 'indent': '-1'}, { 'indent': '+1' }],
                  [{ 'size': ['small', false, 'large', 'huge'] }],
                  [{ 'color': [] }, { 'background': [] }],
                  [{ 'align': [] }],
                  ['clean']
              ]
          }
        });
      } catch (err) {
        document.getElementById('editor-container').innerHTML = '<div style="padding: 15px; color: #dc2626; font-family: sans-serif;">편집기 로드 중 오류가 발생했습니다: ' + err.message + '</div>';
        console.error("Quill initialization failed:", err);
      }

      // Boilerplate for Streamlit component communication
      function sendMessageToStreamlit(type, data) {
        var outData = Object.assign({
            isStreamlitMessage: true,
            type: type,
        }, data);
        window.parent.postMessage(outData, "*");
      }

      function setFrameHeight(height) {
        sendMessageToStreamlit("setFrameHeight", { height: height });
      }

      function sendValue(value) {
        window.lastSentValue = value;
        sendMessageToStreamlit("setComponentValue", { value: value });
      }

      // Send updates to Streamlit when text changes
      quill.on('text-change', function(delta, oldDelta, source) {
        if (source === 'user') {
            sendValue(quill.root.innerHTML);
        }
      });

      // Handle data coming from Streamlit
      function onMessageFromStreamlit(event) {
        if (event.data.type !== "streamlit:render") return;
        window.rendered = true;
        
        let val = event.data.args.value || "";
        // Only update content if it's the first render OR if Python sent a new value different from editor content
        if (!window.initialized || (val !== window.lastSentValue && val !== quill.root.innerHTML && val !== window.lastReceivedValue)) {
            window.lastReceivedValue = val;
            if (val) {
                if (!/<[a-z][\s\S]*>/i.test(val)) {
                    val = val.split('\n').map(line => `<p>${line || '<br>'}</p>`).join('');
                }
                quill.clipboard.dangerouslyPasteHTML(val);
            }
            window.initialized = true;
        }
        
        // Force the iframe to be 420px tall
        setFrameHeight(420);
      }
      
      // Hook up message listener
      window.addEventListener("message", onMessageFromStreamlit);

      // Immediately request height so iframe is never 0px
      setFrameHeight(420);
      window.addEventListener("load", function() { setFrameHeight(420); });

      // Tell Streamlit we are ready to receive data, repeating every 50ms until render message is received
      sendMessageToStreamlit("streamlit:componentReady", {apiVersion: 1});
      var readyInterval = setInterval(function() {
        if (window.rendered) {
          clearInterval(readyInterval);
        } else {
          sendMessageToStreamlit("streamlit:componentReady", {apiVersion: 1});
          setFrameHeight(420);
        }
      }, 50);
    </script>
  </body>
</html>
