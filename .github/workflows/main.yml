name: Keep Streamlit App Awake

# 일정 시간마다 실행 (매일 9시, 15시, 21시 KST = UTC 0, 6, 12)
on:
  schedule:
    - cron: '0 0,6,12 * * *'
  # 수동으로도 실행 가능
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
      # 1단계: Streamlit 앱 URL 접속 (앱을 깨우기 위함)
      - name: Wake up Streamlit app (HTTP request)
        run: |
          curl -X GET https://ahpkrj.streamlit.app/ \
            -H "User-Agent: GitHub-Actions-Bot/1.0" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 || true
        continue-on-error: true

      # 2단계: 저장소 코드 체크아웃 (keepalive-workflow를 위해 필요)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3단계: GitHub Action이 60일 비활성화되는 것을 방지
      # (마지막 커밋 이후 50일이 지났을 때만 빈 커밋을 생성하여 히스토리를 지저분하게 만들지 않음)
      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2
