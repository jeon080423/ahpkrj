name: Keep Streamlit App Awake

# 일정 시간마다 실행 (매일 9시, 15시, 21시 KST = UTC 0, 6, 12)
on:
  schedule:
    - cron: '0 0,6,12 * * *'
  # 수동으로도 실행 가능
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
      # 1단계: Streamlit 앱 URL 접속 (앱을 깨우기 위함)
      - name: Wake up Streamlit app (HTTP request)
        run: |
          curl -X GET https://ahpkrj.streamlit.app/ \
            -H "User-Agent: GitHub-Actions-Bot/1.0" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 || true
        continue-on-error: true

