<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4F46E5" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect x="3" y="3" width="594" height="354" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Symbol Centered -->
  <g transform="translate(240, 45)" filter="url(#softGlow)">
    <polygon points="60,10 110,42 60,74 10,42" fill="url(#pGrad)"/>
    <polygon points="20,55 60,82 60,116 20,88" fill="#3730A3"/>
    <polygon points="100,55 60,82 60,116 100,88" fill="#0284C7"/>
    <circle cx="60" cy="42" r="7" fill="#FFFFFF"/>
    <circle cx="60" cy="82" r="5" fill="#38BDF8"/>
  </g>
  
  <!-- Typography Centered -->
  <text x="300" y="240" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="46" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="-1">AHP<tspan fill="#4F46E5">MASTER</tspan></text>
  <text x="300" y="278" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="4.5">DECISION ANALYTICS SUITE</text>
  
  <!-- Bottom Accent Line -->
  <rect x="250" y="305" width="100" height="4" rx="2" fill="url(#pGrad)"/>
</svg>